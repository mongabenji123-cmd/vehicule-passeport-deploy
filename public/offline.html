<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto-Passeport — Hors ligne</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0c1220; color:#e2e8f0; font-family:system-ui,sans-serif; text-align:center; padding:2rem }
    .box { max-width:320px }
    h1 { font-size:1.5rem; margin-bottom:.5rem }
    p { color:#94a3b8; font-size:.875rem; line-height:1.5 }
    button { margin-top:1.5rem; padding:.75rem 2rem; background:#3b82f6; color:#fff; border:none; border-radius:.5rem; font-size:.875rem; cursor:pointer }
  </style>
</head>
<body>
  <div class="box">
    <h1>📡 Pas de connexion</h1>
    <p>Vous êtes hors ligne. Les données en cache sont toujours disponibles. Reconnectez-vous pour synchroniser.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
